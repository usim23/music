<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazar — Музыка</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin: 0 0 5px 0; font-size: 22px; color: #f0f6fc; }
        p { margin: 0 0 20px 0; font-size: 14px; color: #8b949e; }
        .track { background: #0d1117; border: 1px solid #21262d; border-radius: 12px; padding: 12px 16px; text-align: left; }
        .track-title { font-weight: bold; font-size: 15px; color: #58a6ff; margin-bottom: 8px; }
        audio { width: 100%; outline: none; height: 32px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Мои Треки</h2>
    <p>Nazar</p>

    <div class="track">
        <div class="track-title">🎵 MIA BOYKA - Alex Vasaby Radio Remix</div>
        <audio controls src="https://www.dropbox.com/scl/fi/n9bufqjplbh9s292f87pn/MIA-BOYKA-Alex-Vasaby-Radio-Remix.mp3?rlkey=2ej90ub7lcjpek877djpl5fos&st=w7ma8yy7&raw=1"></audio>
    </div>
</div>

</body>
</html>
