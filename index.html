[24.08.2026 0:21] Nazar: <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный Плеер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0f12; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { font-size: 20px; margin-bottom: 16px; text-align: center; color: #58a6ff; }
        .upload-zone { border: 2px dashed #30363d; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; background: #0d1117; }
        input[type="file"] { margin-bottom: 12px; width: 100%; color: #8b949e; font-size: 14px; }
        button { background: #238636; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; transition: 0.2s; }
        button:hover { background: #2ea043; }
        button:disabled { background: #30363d; cursor: not-allowed; }
        .track { background: #0d1117; border: 1px solid #21262d; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .track-title { font-size: 14px; color: #f0f6fc; margin-bottom: 8px; word-break: break-all; font-weight: 600; }
        audio { width: 100%; height: 36px; margin-bottom: 10px; }
        .actions { display: flex; gap: 8px; }
        .btn-del { background: #da3633; padding: 8px 12px; width: auto; font-size: 12px; }
        .btn-del:hover { background: #f85149; }
        .btn-down { background: #1f6beb; padding: 8px 12px; font-size: 12px; text-decoration: none; color: white; border-radius: 8px; display: inline-block; font-weight: bold; text-align: center; }
        .btn-down:hover { background: #388bfd; }
        #status { font-size: 13px; text-align: center; color: #8b949e; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎵 Плеер треков</h2>

    <div class="upload-zone">
        <input type="file" id="fileInput" accept="audio/*">
        <button id="uploadBtn" onclick="uploadTrack()">Загрузить песню на сайт</button>
        <div id="status"></div>
    </div>

    <div id="playlist">Загрузка музыки...</div>
</div>

<script>
    const GITHUB_USERNAME = 'usim23';
    const REPO_NAME = 'music'; // 👈 Впиши сюда название репозитория!
    const GITHUB_TOKEN = 'Ghp_GxVn5V1JiWqDQD4GnB4VPQT0KAj0WT4ahse0';

    const API_URL = https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/music;

    async function loadTracks() {
        const playlist = document.getElementById('playlist');
        try {
            const res = await fetch(API_URL, {
                headers: { 'Authorization': token ${GITHUB_TOKEN} }
            });
            
            if (res.status === 404) {
                playlist.innerHTML = '<p style="text-align:center; color:#8b949e;">Папка с музыкой пока пуста</p>';
                return;
            }

            const files = await res.json();
            playlist.innerHTML = '';

            const audioFiles = files.filter(f => f.name.endsWith('.mp3')  f.name.endsWith('.wav')  f.name.endsWith('.m4a'));

            if (audioFiles.length === 0) {
                playlist.innerHTML = '<p style="text-align:center; color:#8b949e;">Песен пока нет</p>';
                return;
            }

            audioFiles.forEach(file => {
                const trackUrl = file.download_url;
                playlist.innerHTML += `
                    <div class="track">
                        <div class="track-title">🎵 ${file.name}</div>
[24.08.2026 0:21] Nazar: <audio controls src="${trackUrl}"></audio>
                        <div class="actions">
                            <a href="${trackUrl}" download class="btn-down">💾 Скачать</a>
                            <button class="btn-del" onclick="deleteTrack('${file.name}', '${file.sha}')">🗑 Удалить</button>
                        </div>
                    </div>
                ;
            });
        } catch (e) {
            playlist.innerHTML = '<p style="text-align:center; color:#f85149;">Ошибка загрузки списка треков</p>';
        }
    }

    async function uploadTrack() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        const status = document.getElementById('status');
        if (!file) return alert('Выбери MP3 файл!');

        const btn = document.getElementById('uploadBtn');
        btn.innerText = 'Загрузка...';
        btn.disabled = true;
        status.innerText = 'Отправка файла на сервер...';

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const content = reader.result.split(',')[1];

            const response = await fetch(${API_URL}/${encodeURIComponent(file.name)}, {
                method: 'PUT',
                headers: {
                    'Authorization': token ${GITHUB_TOKEN},
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: Добавлен трек ${file.name},
                    content: content
                })
            });

            if (response.ok) {
                status.innerText = 'Готово!';
                fileInput.value = '';
                loadTracks();
            } else {
                alert('Ошибка при загрузке трека!');
                status.innerText = '';
            }
            btn.innerText = 'Загрузить песню на сайт';
            btn.disabled = false;
        };
    }

    async function deleteTrack(fileName, sha) {
        if (!confirm(Удалить песню ${fileName}?)) return;

        const response = await fetch(${API_URL}/${encodeURIComponent(fileName)}, {
            method: 'DELETE',
            headers: {
                'Authorization': token ${GITHUB_TOKEN},
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: Удален трек ${fileName}`,
                sha: sha
            })
        });

        if (response.ok) {
            loadTracks();
        } else {
            alert('Не удалось удалить файл');
        }
    }

    loadTracks();
</script>

</body>
</html>
