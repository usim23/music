<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazar — Плейлист</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { margin: 0 0 5px 0; font-size: 22px; color: #f0f6fc; text-align: center; }
        p.subtitle { margin: 0 0 20px 0; font-size: 14px; color: #8b949e; text-align: center; }
        .track { background: #0d1117; border: 1px solid #21262d; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
        .track-title { font-weight: bold; font-size: 15px; color: #58a6ff; margin-bottom: 8px; }
        audio { width: 100%; outline: none; height: 32px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Мои Треки</h2>
    <p class="subtitle">Nazar</p>
    <div id="playlist">Загрузка плейлиста...</div>
</div>

<script>
    const BIN_ID = "6a8b5a83da38895dfe07e72a";

    async function loadTracks() {
        try {
            const res = await fetch(https://api.jsonbin.io/v3/b/${BIN_ID}/latest);
            const data = await res.json();
            const playlist = document.getElementById("playlist");
            playlist.innerHTML = "";

            if (!data.record || data.record.length === 0) {
                playlist.innerHTML = "<p style='text-align:center;'>Плейлист пуст</p>";
                return;
            }

            data.record.forEach(track => {
                playlist.innerHTML += 
                    <div class="track">
                        <div class="track-title">🎵 ${track.title}</div>
                        <audio controls src="${track.url}"></audio>
                    </div>
                ;
            });
        } catch (e) {
            document.getElementById("playlist").innerHTML = "Ошибка загрузки песен.";
        }
    }

    loadTracks();
</script>

</body>
</html>
